<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="./css/output.css">
  <link rel="stylesheet" href="/src/output.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk - Atlas Solutions</title>

</head>

<body class="bg-slate-50 font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 flex justify-between items-center">
    <div class="max-w-6xl px-5 py-5 flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-slate-800 text-white flex items-center justify-center text-3xl font-bold">
        H
      </div>
      <div>
        <h1 class="text-3xl font-bold">HelpDesk</h1>

      </div>
    </div>
    <p class=" text-sm text-slate-500 items-center">Atlas Solutions / Support</p>
  </header>

  <main class=" mr-5% ml-5% px-5 py-10 ">

    <!-- Introduction -->
    <section class="mb-8">
      <h2 class="text-3xl font-bold mb-2">Gestion des demandes</h2>
      <p class="text-slate-500">
        Centralisez les incidents et simplifiez le suivi de votre équipe.
      </p>
    </section>

    <!-- Form -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-10">
      <h3 class="text-xl font-bold mb-2">Créer une demande</h3>
      <p class="text-sm text-slate-500 mb-6">
        Décrivez votre problème informatique en quelques étapes.
      </p>

      <form id="ticketForm" class="space-y-5">

        <div class="form-grid">
          <div class="title-area">
            <label for="title" class="block text-sm font-semibold mb-2">
              Titre du problème *
            </label>
            <input id="TITLE" name="title" required placeholder="Ex. Connexion Wi-Fi instable"
              class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="category" class="block text-sm font-semibold mb-2">
              Catégorie *
            </label>
            <select id="category" name="category" required
              class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white">
              <option value="Réseau">Réseau</option>
              <option value="Logiciel">Logiciel</option>
              <option value="Matériel">Matériel</option>
            </select>
          </div>

          <div>
            <label for="priority" class="block text-sm font-semibold mb-2">
              Priorité *
            </label>
            <select id="priority" name="priority" required
              class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white">
              <option value="Haute">Haute</option>
              <option value="Normale" selected>Normale</option>
              <option value="Basse">Basse</option>
            </select>
          </div>


          <div class="description-area">
            <label for="description" class="block text-sm font-semibold mb-2 ">
              Description *
            </label>
            <div class="description-area">
              <label for="description" class="block text-sm font-semibold mb-2">
                Description *
              </label>

              <textarea id="description" name="description" required rows="4"
                placeholder="Décrivez le problème informatique rencontré..."
                class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit"
              class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg px-5 py-3">
              + Ajouter la demande
            </button>
          </div>
        </div>
      </form>

      <!-- Ticket list -->
      <section id="tickets">
        <div>
            <h2 class="text-2xl font-bold">Liste des demandes</h2>
            <p id="ticketCount" class="text-sm text-slate-500 mt-1">3 demandes</p>
          </div>

        <div class="flex flex-wrap">


          <div id="ticketList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </section>

  </main>

  <script>

    let tickets = [
      {
        id: 1,
        title: "Connexion Wi-Fi instable",
        description: "Le réseau se déconnecte régulièrement.",
        category: "Réseau",
        priority: "Haute"
      },
      {
        id: 2,
        title: "Installation d’un logiciel",
        description: "Installer un logiciel sur le poste.",
        category: "Logiciel",
        priority: "Normale"
      },
      {
        id: 3,
        title: "Clavier défectueux",
        description: "Certaines touches ne fonctionnent plus.",
        category: "Matériel",
        priority: "Basse"
      }
    ];

    let nextId = 4;

    const FORM = document.getElementById("ticketForm");
    const LIST = document.getElementById("ticketList");
    const CONT = document.getElementById("ticketCount");

    function AFF() {
      CONT.textContent = tickets.length + " demandes";
      LIST.replaceChildren();

      tickets.forEach(function (TICKET) {
        const CARD = document.createElement("div");

        CARD.className =
          "bg-white rounded-2xl border border-slate-200 shadow-sm p-6";

        const TITLE = document.createElement("h3");
        TITLE.className = "text-xl font-bold mb-2";
        TITLE.textContent = TICKET.title;

        const DESCRIPTION = document.createElement("p");
        DESCRIPTION.className = "text-slate-500 mb-4";
        DESCRIPTION.textContent = TICKET.description;

        const CATEGORY = document.createElement("p");
        CATEGORY.className = "text-sm mb-2";
        CATEGORY.innerHTML = "<strong>Catégorie : </strong>";
        CATEGORY.append(TICKET.category);

        const PRIORITY = document.createElement("p");
        PRIORITY.className = "text-sm";
        PRIORITY.innerHTML = "<strong>Priorité : </strong>";
        PRIORITY.append(TICKET.priority);

        const BTN = document.createElement("button");
        BTN.textContent = "♜ Supprimer";
        BTN.className = "bg-red hover:bg-black text-#CC626A font-bold py-2 px-4 rounded";

        CARD.append(TITLE, DESCRIPTION, CATEGORY, PRIORITY, BTN);
        LIST.appendChild(CARD);
      });
    }

    // Display initial tickets
    AFF();

    // Add a new ticket
    FORM.addEventListener("submit", function (event) {
      event.preventDefault();

      const NEW_TICKET = {
        id: nextId++,
        title: document.getElementById("TITLE").value.trim(),
        description: document.getElementById("description").value.trim(),
        category: document.getElementById("category").value,
        priority: document.getElementById("priority").value
      };

      tickets.push(NEW_TICKET);

      AFF();

      FORM.reset();
    });


  </script>

</body>

</html>
